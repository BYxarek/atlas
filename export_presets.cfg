[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="assets/*.json,assets/i18n/*.json,assets/legal/*"
exclude_filter="examples/*,website/*,.github/*,docs/*,tools/*,tests/*,build/*,server/*,hosting/*,README.md,LICENSES.md"
export_path="build/windows-v0.3.0/Atlas.exe"

[preset.0.options]
custom_template/debug="res://tools/godot-4.8-beta2/windows_release_x86_64.exe"
custom_template/release="res://tools/godot-4.8-beta2/windows_release_x86_64.exe"
binary_format/architecture="x86_64"
binary_format/embed_pck=true
application/modify_resources=true
application/icon="res://assets/icon.svg"
application/product_name="ATLAS"
application/file_description="ATLAS — Мировое господство"
application/file_version="0.3.0.0"
application/product_version="0.3.0"
codesign/enable=false

[preset.1]
name="VPS Server"
platform="Linux"
runnable=false
custom_features="dedicated_server"
export_filter="all_resources"
include_filter="assets/*.json,assets/i18n/*.json,assets/legal/*"
exclude_filter="examples/*,website/*,.github/*,docs/*,tools/*,tests/*,build/*,server/*,hosting/*,assets/audio/*,README.md,LICENSES.md"
export_path="build/vps/AtlasServer.pck"

[preset.1.options]
binary_format/architecture="x86_64"

[preset.2]
name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter="assets/*.json,assets/i18n/*.json,assets/legal/*"
exclude_filter="examples/*,website/*,.github/*,docs/*,tools/*,tests/*,build/*,server/*,hosting/*,README.md,LICENSES.md"
export_path="build/android/Atlas.apk"

[preset.2.options]
custom_template/debug="res://tools/godot-4.8-beta2/android_debug.apk"
custom_template/release="res://tools/godot-4.8-beta2/android_release.apk"
gradle_build/use_gradle_build=false
gradle_build/min_sdk=""
gradle_build/target_sdk=""
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=true
architectures/x86_64=true
version/code=14
version/name="0.3.0"
package/unique_name="org.byxarek.atlas"
package/name="ATLAS"
package/signed=true
package/app_category=0
screen/immersive_mode=true
splash_screen/icon="res://assets/icon.svg"
splash_screen/background_color=Color(0.035, 0.055, 0.075, 1)
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
permissions/internet=true
permissions/access_network_state=true
