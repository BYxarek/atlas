services:
  atlas:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      ATLAS_PORT: "24760"
      ATLAS_MAX_ROOMS: "${ATLAS_MAX_ROOMS:-8}"
      ATLAS_DATA_DIR: /data
    volumes:
      - atlas-data:/data
    expose:
      - "24760"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1',24760),3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ATLAS_DOMAIN: "${ATLAS_DOMAIN:?Set ATLAS_DOMAIN in server/.env}"
      ACME_EMAIL: "${ACME_EMAIL:?Set ACME_EMAIL in server/.env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      atlas:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  atlas-data:
  caddy-data:
  caddy-config:
